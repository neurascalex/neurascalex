<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO -->
    <title>NeuraScaleX | Governed Digital Twins for Health Professionals</title>
    <meta name="description" content="NeuraScaleX deploys a governed Digital Twin to answer routine patient questions safely, plus an Intelligence dashboard that shows what patients need and what to do next." />
    <link rel="canonical" href="https://neurascalex.com/" />

    <!-- Keywords (optional, low impact but OK) -->
    <meta name="keywords" content="clinician digital twin, governed AI for healthcare, patient engagement, non-clinical AI assistant, medical practice website assistant, healthcare AI safety, patient FAQs, clinical admin reduction, private practice automation, UK health professionals, psychiatry practice, pain clinic, women's health" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NeuraScaleX" />
    <meta property="og:title" content="Your Expertise. Scaled. Your Digital Twin + Intelligence." />
    <meta property="og:description" content="A 24/7 website assistant built from your approved material—plus Intelligence showing what patients need and what to do next. Non-clinical by design." />
    <meta property="og:url" content="https://neurascalex.com/" />
    <meta property="og:image" content="https://neurascalex.com/og-home.jpg" />
    <meta property="og:image:alt" content="NeuraScaleX: Governed Digital Twin + Intelligence for health professionals" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NeuraScaleX | Governed Digital Twins for Health Professionals" />
    <meta name="twitter:description" content="A 24/7 Digital Twin built from approved materials—plus Intelligence that shows what patients need next. Non-clinical by design." />
    <meta name="twitter:image" content="https://neurascalex.com/og-home.jpg" />

    <!-- Locale -->
    <meta property="og:locale" content="en_GB" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --deep-teal: #004d4d;
        --navy: #001f3f;
        --gold: #d4af37;
        --soft-green: #e6f4f1;
        --warm-white: #fdfcf9;
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--warm-white);
        color: var(--navy);
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3,
      h4,
      .serif {
        font-family: "Cormorant Garamond", serif;
      }
      .bg-geometric {
        background-image: radial-gradient(
          circle at 2px 2px,
          rgba(0, 77, 77, 0.05) 1px,
          transparent 0
        );
        background-size: 40px 40px;
      }
      .hero-gradient {
        background: linear-gradient(
          135deg,
          var(--navy) 0%,
          var(--deep-teal) 100%
        );
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              teal: {
                900: "#003333",
                800: "#004d4d",
                700: "#006666",
              },
              navy: {
                950: "#000d1a",
                900: "#001a33",
                800: "#001f3f",
              },
              gold: {
                400: "#e5c05b",
                500: "#d4af37",
                600: "#b8962e",
              },
              softgreen: "#e6f4f1",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-geometric">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
